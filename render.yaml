# Render.com blueprint — free tier is enough for this read-only API.
# Deploy: push this repo to GitHub → Render "New +" → Blueprint → pick repo.
services:
  - type: web
    name: mmmut-ero-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.app:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: API_ALLOW_ORIGIN
        value: https://coldlogic144-prog.github.io
      # The CSV ships with the repo (data/admission_data.csv). To refresh the
      # roster without redeploying, host it elsewhere and set a URL fetch —
      # for now the repo copy is the source of truth.
